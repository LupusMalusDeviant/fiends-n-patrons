# Engine access for jobs that run cargo against the private Grimoire repository (ADR-0009).
#
#  * No Cargo.toml references github.com/LupusMalusDeviant/grimoire -> cargo steps run normally.
#  * Referenced and deploy key available -> key goes into ssh-agent, engine URLs are rewritten
#    to SSH and Cargo fetches through the git CLI.
#  * Referenced but key missing -> hard failure when `require` is 'true' (CI on pushes, manual
#    runs and same-repository pull requests, Nightly, Release); warning plus skipped cargo steps
#    only when `require` is 'false', i.e. pull requests that receive no secrets (forks,
#    Dependabot). Every Cargo.toml revision since P0/WP6.3 references the engine, so a missing
#    key is a broken setup (for example a revoked gh authorisation), never a transition.
#
# Callers gate their cargo steps on `steps.<id>.outputs.cargo == 'true'`.
# The secret is handed over as an input; it reaches the detection step only through env,
# because secrets cannot be tested in `if:` expressions directly.
name: Grimoire engine access
description: Detects the engine git dependency and loads the read-only deploy key.

inputs:
  deploy-key:
    description: Private SSH deploy key (secrets.GRIMOIRE_DEPLOY_KEY). May be empty.
    required: false
    default: ""
  require:
    description: "'true' fails the job when the engine is referenced but no key is available."
    required: false
    default: "false"

outputs:
  cargo:
    description: "'true' when the cargo steps can run, 'false' when they must be skipped."
    value: ${{ steps.detect.outputs.cargo }}
  engine-referenced:
    description: "'true' when a Cargo.toml references the Grimoire git repository."
    value: ${{ steps.detect.outputs.referenced }}

runs:
  using: composite
  steps:
    - name: Detect engine reference and deploy key
      id: detect
      shell: bash
      env:
        DEPLOY_KEY: ${{ inputs.deploy-key }}
        REQUIRE_KEY: ${{ inputs.require }}
      run: |
        set -euo pipefail

        # git grep exits 1 when nothing matches; capture it instead of letting -e abort the step.
        status=0
        # Case-sensitive on purpose: the SSH rewrite below (url.insteadOf) is an exact prefix match.
        git grep -n -I -E -e 'github\.com[:/]LupusMalusDeviant/grimoire' -- ':(glob)**/Cargo.toml' || status=$?
        case "$status" in
          0) referenced=true ;;
          1)
            referenced=false
            # A differently cased URL would be detected but never rewritten, and the fetch would fail
            # with an obscure authentication error. Stop with a clear message instead.
            if git grep -n -I -i -E -e 'github\.com[:/]LupusMalusDeviant/grimoire' -- ':(glob)**/Cargo.toml'; then
              echo "::error title=Engine-URL falsch geschrieben::Ein Cargo.toml nennt die Engine mit abweichender Gross-/Kleinschreibung. Exakt https://github.com/LupusMalusDeviant/grimoire verwenden, sonst greift die SSH-Umlenkung nicht."
              exit 1
            fi
            ;;
          *) echo "::error title=Engine-Erkennung defekt::git grep ist mit Status ${status} fehlgeschlagen."; exit "$status" ;;
        esac

        has_key=false
        if [ -n "${DEPLOY_KEY}" ]; then
          has_key=true
        fi

        if [ "$referenced" = false ]; then
          echo "Keine Engine-Git-Abhaengigkeit gefunden: Cargo-Schritte laufen ohne Deploy-Key."
          cargo=true
          use_key=false
        elif [ "$has_key" = true ]; then
          echo "Engine-Git-Abhaengigkeit gefunden, Deploy-Key vorhanden: Zugriff ueber SSH."
          cargo=true
          use_key=true
        elif [ "$REQUIRE_KEY" = true ]; then
          echo "::error title=Engine-Zugriff fehlt::Das Spiel haengt von github.com/LupusMalusDeviant/grimoire ab, aber das Secret GRIMOIRE_DEPLOY_KEY fehlt. Einrichten mit scripts/setup-ci-deploy-key.ps1."
          exit 1
        else
          echo "::warning title=Engine-Zugriff fehlt, Cargo-Schritte uebersprungen::Das Spiel haengt von github.com/LupusMalusDeviant/grimoire ab, aber das Secret GRIMOIRE_DEPLOY_KEY ist nicht verfuegbar. Einrichten mit scripts/setup-ci-deploy-key.ps1 (lokal ausfuehren). Dieser Lauf hat NICHTS gebaut oder getestet."
          {
            echo "### Engine-Zugriff fehlt"
            echo
            echo "Cargo-Schritte wurden **uebersprungen**: Das Secret \`GRIMOIRE_DEPLOY_KEY\` ist nicht gesetzt."
            echo "Einrichtung im offenen PowerShell-Fenster: \`& ./scripts/setup-ci-deploy-key.ps1\` (siehe CONTRIBUTING.md)"
          } >> "$GITHUB_STEP_SUMMARY"
          cargo=false
          use_key=false
        fi

        {
          echo "referenced=${referenced}"
          echo "use-key=${use_key}"
          echo "cargo=${cargo}"
        } >> "$GITHUB_OUTPUT"

    - name: Load deploy key into ssh-agent
      if: steps.detect.outputs.use-key == 'true'
      uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
      with:
        ssh-private-key: ${{ inputs.deploy-key }}
        log-public-key: false

    - name: Route engine fetches over SSH
      if: steps.detect.outputs.use-key == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        # GitHub's SSH host keys from the TLS-protected API instead of trust-on-first-use.
        mkdir -p ~/.ssh
        gh api meta --jq '.ssh_keys[] | "github.com " + .' >> ~/.ssh/known_hosts
        # Only the owner's URLs go over SSH; crates.io and public git dependencies stay on HTTPS.
        git config --global url."git@github.com:LupusMalusDeviant/".insteadOf "https://github.com/LupusMalusDeviant/"
        echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
        echo "Engine-Zugriff eingerichtet: https://github.com/LupusMalusDeviant/ -> git@github.com:LupusMalusDeviant/ (git CLI)."
