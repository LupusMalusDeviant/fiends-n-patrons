# Nightly game builds from main: release binaries for three operating systems as 7-day artifacts.
# Scheduled runs are skipped when main did not change (push or merge) in the last 24 hours.
# Nightly Windows binaries are unsigned; only tagged releases are signed (locally, see CONTRIBUTING.md).
name: Nightly

on:
  schedule:
    # 02:47 UTC, off the full hour and after the engine nightly.
    - cron: "47 2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # The engine is a public repository fetched anonymously over HTTPS (ADR-0013); fail at once
  # instead of waiting for a credential prompt if it is ever not publicly reachable.
  GIT_TERMINAL_PROMPT: "0"
  GCM_INTERACTIVE: never

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Commits in the last 24 hours?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Decides on when main last MOVED (pushes and merges from the repository activity API), not
      # on commit dates: a commit made days ago and pushed today still counts as a change.
      - name: Did main change in the last 24 hours?
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          since=""
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "Manueller Start: Nightly laeuft unabhaengig von Aenderungen."
          else
            # "<count> <sha of main before the oldest change in the last 24 hours>"
            if result=$(gh api "repos/${GITHUB_REPOSITORY}/activity?ref=refs/heads/main&time_period=day&per_page=100" \
                  --jq '[.[] | select(.activity_type != "branch_deletion")] | "\(length) \(last.before // "")"') \
               && [[ "$result" =~ ^[0-9]+\ [0-9a-f]*$ ]]; then
              count="${result%% *}"
              since="${result#* }"
              echo "Aenderungen an main in den letzten 24 Stunden (Aktivitaets-API): ${count}"
            else
              # Fallback: committer date of HEAD (misses commits that were pushed long after creation).
              echo "::warning title=Aktivitaets-API nicht verfuegbar::Entscheidung ueber das Committer-Datum von HEAD."
              age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
              count=$(( age < 86400 ? 1 : 0 ))
            fi
            if [ "$count" -eq 0 ]; then
              echo "::notice title=Nightly uebersprungen::Keine Aenderungen an main in den letzten 24 Stunden."
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          # Short changelog (PRD-0017 FR-06): everything main gained in the last 24 hours.
          {
            echo "## Nightly $(date -u +%Y-%m-%d) ($(git rev-parse --short HEAD))"
            echo
            if [ -n "$since" ] && [[ ! "$since" =~ ^0+$ ]] && git cat-file -e "${since}^{commit}" 2>/dev/null; then
              echo "Neu auf main seit ${since::8} (Stand vor 24 Stunden):"
              echo
              git log --no-merges --format='- %s (%h)' "${since}..HEAD" | grep . || echo "- (keine)"
            else
              echo "Commits der letzten 24 Stunden (nach Commit-Datum):"
              echo
              git log --since="24 hours ago" --no-merges --format='- %s (%h)' | grep . || echo "- (keine)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The asset gate on all three systems (Plan 0002 WP9.3). The CI runs it on Linux for every push;
  # here it runs where a difference between operating systems would show up — path handling, file
  # order, line endings. The compiler itself is the engine's own at the pinned tag, so identical
  # units on three systems are the engine's promise (its own identity gate), not this job's; what
  # this job proves is that the tooling around it behaves the same everywhere.
  content:
    name: asset compiler (${{ matrix.case.name }}, ${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        case:
          - name: content/
            directory: content
            out: packs
            expect: pass
            codes: ""
          - name: negative proof
            directory: tests/fixtures/sigil-broken
            out: packs/negative
            expect: fail
            codes: tests/fixtures/sigil-broken/expected-codes.txt
    steps:
      - uses: actions/checkout@v7
      - name: Engine pin from Cargo.lock
        id: pin
        run: bash .github/scripts/engine-pin.sh | tee -a "$GITHUB_OUTPUT"
      # Second checkout of the public engine repository (ADR-0013): no secret and no deploy key, only
      # the automatic read-only workflow token, which is not persisted.
      - name: Check out the engine at the pinned tag
        uses: actions/checkout@v7
        with:
          repository: LupusMalusDeviant/grimoire
          ref: ${{ steps.pin.outputs.tag }}
          path: engine
          persist-credentials: false
      - name: The tag is the commit Cargo.lock pins
        env:
          EXPECTED: ${{ steps.pin.outputs.rev }}
        run: |
          set -euo pipefail
          actual=$(git -C engine rev-parse HEAD)
          echo "Tag ${{ steps.pin.outputs.tag }} -> $actual"
          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error title=Engine-Tag verschoben::Tag ${{ steps.pin.outputs.tag }} zeigt auf $actual, Cargo.lock pinnt $EXPECTED."
            exit 1
          fi
      # `grimoire-ac` is younger than the engine tag this game pins; until the pin reaches a tag that
      # ships it, exactly the tag named in .github/asset-gate-bootstrap runs without the gate, loudly.
      # That file becomes an error the moment a pinned tag carries the compiler, so the exemption
      # cannot outlive its reason.
      - name: Does the pinned tag carry the asset compiler?
        id: tools
        run: bash .github/scripts/asset-tools-ready.sh "${{ steps.pin.outputs.tag }}"
      - uses: actions/cache@v6
        if: steps.tools.outputs.ready == 'true'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            engine/target
          key: asset-tools-${{ runner.os }}-${{ steps.pin.outputs.tag }}-${{ hashFiles('Cargo.lock', 'engine/tools/global.json') }}
          restore-keys: |
            asset-tools-${{ runner.os }}-${{ steps.pin.outputs.tag }}-
      - name: Install the engine's pinned toolchain (rust-toolchain.toml)
        if: steps.tools.outputs.ready == 'true'
        run: rustup toolchain install
        working-directory: engine
      - name: Build sigilc from the pinned tag
        if: steps.tools.outputs.ready == 'true'
        run: cargo build --release -p grimoire_sigilc --bin sigilc --locked
        working-directory: engine
      - uses: actions/setup-dotnet@v6
        if: steps.tools.outputs.ready == 'true'
        with:
          global-json-file: engine/tools/global.json
          cache: true
          cache-dependency-path: engine/tools/**/packages.lock.json
      - name: Build grimoire-ac from the pinned tag
        if: steps.tools.outputs.ready == 'true'
        working-directory: engine
        run: |
          set -euo pipefail
          dotnet restore tools/src/Grimoire.AssetCompiler/Grimoire.AssetCompiler.csproj --locked-mode
          dotnet build tools/src/Grimoire.AssetCompiler/Grimoire.AssetCompiler.csproj --no-restore --configuration Release
      - name: Tool paths
        if: steps.tools.outputs.ready == 'true'
        run: |
          set -euo pipefail
          suffix=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            suffix=".exe"
          fi
          {
            echo "GRIMOIRE_SIGILC=$GITHUB_WORKSPACE/engine/target/release/sigilc$suffix"
            echo "GRIMOIRE_AC=$GITHUB_WORKSPACE/engine/tools/src/Grimoire.AssetCompiler/bin/Release/net10.0/grimoire-ac$suffix"
          } >>"$GITHUB_ENV"
      - name: grimoire-ac build ${{ matrix.case.directory }}
        if: steps.tools.outputs.ready == 'true'
        run: bash .github/scripts/asset-gate.sh "${{ matrix.case.directory }}" "${{ matrix.case.out }}" "${{ matrix.case.expect }}" "${{ matrix.case.codes }}"

  build:
    name: release build (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-latest
            platform: macos-aarch64
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Own step so that a failed engine fetch is told apart from a build failure.
      - name: Fetch dependencies (engine anonymously over HTTPS)
        run: cargo fetch --locked
      # The shipped binary uses the release profile; CI tests only the dev profile. Optimisation
      # level must not change the arena's golden hash on any platform (tests/determinism.rs).
      - name: Determinism gate (release profile)
        run: cargo test --release --locked -p fnp_sim_harness --test determinism
      - name: Build fiends-n-patrons (release)
        run: cargo build --release --locked -p fnp_app --bin fiends-n-patrons
      # upload-artifact drops the executable bit, so Unix binaries travel inside a tarball.
      - name: Package
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          name="fiends-n-patrons-nightly-$(date -u +%Y%m%d)-${GITHUB_SHA::8}-${PLATFORM}"
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/fiends-n-patrons.exe "dist/${name}.exe"
          else
            tar -czf "dist/${name}.tar.gz" -C target/release fiends-n-patrons
          fi
          ls -l dist
      - name: Upload nightly artifact
        uses: actions/upload-artifact@v7
        with:
          name: fiends-n-patrons-nightly-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
