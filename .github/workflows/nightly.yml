# Nightly game builds from main: release binaries for three operating systems as 7-day artifacts.
# Scheduled runs are skipped when main did not change (push or merge) in the last 24 hours.
# Nightly Windows binaries are unsigned; only tagged releases are signed (locally, see CONTRIBUTING.md).
name: Nightly

on:
  schedule:
    # 02:47 UTC, off the full hour and after the engine nightly.
    - cron: "47 2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Commits in the last 24 hours?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Decides on when main last MOVED (pushes and merges from the repository activity API), not
      # on commit dates: a commit made days ago and pushed today still counts as a change.
      - name: Did main change in the last 24 hours?
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          since=""
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "Manueller Start: Nightly laeuft unabhaengig von Aenderungen."
          else
            # "<count> <sha of main before the oldest change in the last 24 hours>"
            if result=$(gh api "repos/${GITHUB_REPOSITORY}/activity?ref=refs/heads/main&time_period=day&per_page=100" \
                  --jq '[.[] | select(.activity_type != "branch_deletion")] | "\(length) \(last.before // "")"') \
               && [[ "$result" =~ ^[0-9]+\ [0-9a-f]*$ ]]; then
              count="${result%% *}"
              since="${result#* }"
              echo "Aenderungen an main in den letzten 24 Stunden (Aktivitaets-API): ${count}"
            else
              # Fallback: committer date of HEAD (misses commits that were pushed long after creation).
              echo "::warning title=Aktivitaets-API nicht verfuegbar::Entscheidung ueber das Committer-Datum von HEAD."
              age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
              count=$(( age < 86400 ? 1 : 0 ))
            fi
            if [ "$count" -eq 0 ]; then
              echo "::notice title=Nightly uebersprungen::Keine Aenderungen an main in den letzten 24 Stunden."
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          # Short changelog (PRD-0017 FR-06): everything main gained in the last 24 hours.
          {
            echo "## Nightly $(date -u +%Y-%m-%d) ($(git rev-parse --short HEAD))"
            echo
            if [ -n "$since" ] && [[ ! "$since" =~ ^0+$ ]] && git cat-file -e "${since}^{commit}" 2>/dev/null; then
              echo "Neu auf main seit ${since::8} (Stand vor 24 Stunden):"
              echo
              git log --no-merges --format='- %s (%h)' "${since}..HEAD" | grep . || echo "- (keine)"
            else
              echo "Commits der letzten 24 Stunden (nach Commit-Datum):"
              echo
              git log --since="24 hours ago" --no-merges --format='- %s (%h)' | grep . || echo "- (keine)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: release build (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-latest
            platform: macos-aarch64
    steps:
      - uses: actions/checkout@v7
      - name: Engine access
        id: engine
        uses: ./.github/actions/engine-access
        with:
          deploy-key: ${{ secrets.GRIMOIRE_DEPLOY_KEY }}
      - name: Install pinned toolchain (rust-toolchain.toml)
        if: steps.engine.outputs.cargo == 'true'
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.engine.outputs.cargo == 'true'
      - name: Build fiends-n-patrons (release)
        if: steps.engine.outputs.cargo == 'true'
        run: cargo build --release --locked -p fnp_app --bin fiends-n-patrons
      # upload-artifact drops the executable bit, so Unix binaries travel inside a tarball.
      - name: Package
        if: steps.engine.outputs.cargo == 'true'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          name="fiends-n-patrons-nightly-$(date -u +%Y%m%d)-${GITHUB_SHA::8}-${PLATFORM}"
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/fiends-n-patrons.exe "dist/${name}.exe"
          else
            tar -czf "dist/${name}.tar.gz" -C target/release fiends-n-patrons
          fi
          ls -l dist
      - name: Upload nightly artifact
        if: steps.engine.outputs.cargo == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: fiends-n-patrons-nightly-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
