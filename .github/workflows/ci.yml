# Game CI: format check and three-OS matrix (clippy, tests, build) against the pinned engine.
# Every push that triggers this workflow is watched until it finishes:
#   gh run watch --exit-status        (red run: gh run view --log-failed)
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

# Superseded pull request runs are cancelled. Runs on main are never cancelled: every main commit
# gets a verdict, gh run watch --exit-status does not end as "cancelled", and the main-only cache
# save is not lost.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: bash

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      # cargo fmt does not resolve dependencies, so it needs no engine access.
      - name: cargo fmt --check
        run: cargo fmt --all --check

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      # A missing deploy key fails the job. Only pull requests that receive no secrets (forks,
      # Dependabot) skip the Cargo steps with a warning instead.
      - name: Engine access
        id: engine
        uses: ./.github/actions/engine-access
        with:
          deploy-key: ${{ secrets.GRIMOIRE_DEPLOY_KEY }}
          require: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
      - name: Install pinned toolchain (rust-toolchain.toml)
        if: steps.engine.outputs.cargo == 'true'
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.engine.outputs.cargo == 'true'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        if: steps.engine.outputs.cargo == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The engine contract keeps the facade's determinism lints identical in every simulation
      # crate; the game's copies must match the clippy.toml of the pinned engine tag.
      - name: Determinism lint copies match the pinned facade
        if: steps.engine.outputs.cargo == 'true' && runner.os == 'Linux'
        run: |
          set -euo pipefail
          manifest=$(cargo metadata --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "grimoire") | .manifest_path')
          facade="$(dirname "$manifest")/clippy.toml"
          test -f "$facade"
          status=0
          for required in crates/fnp_game crates/fnp_sim_harness; do
            if [ ! -f "$required/clippy.toml" ]; then
              echo "::error title=clippy.toml fehlt::$required/clippy.toml fehlt (Kopie von crates/grimoire/clippy.toml der Engine)."
              status=1
            fi
          done
          for copy in crates/*/clippy.toml; do
            if ! diff -u "$facade" "$copy"; then
              echo "::error file=$copy,title=clippy.toml veraltet::$copy weicht von crates/grimoire/clippy.toml des gepinnten Engine-Tags ab. Datei aus dem Tag kopieren (CONTRIBUTING.md, Engine-Upgrade)."
              status=1
            fi
          done
          exit "$status"
      # --no-fail-fast: a red unit test must not stop the determinism gate of later test binaries.
      - name: Test
        if: steps.engine.outputs.cargo == 'true'
        run: cargo test --workspace --locked --no-fail-fast
      - name: Build
        if: steps.engine.outputs.cargo == 'true'
        run: cargo build --workspace --locked
