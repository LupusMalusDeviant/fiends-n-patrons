# Game CI: format check and three-OS matrix (clippy, tests, build) against the pinned engine.
# Every push that triggers this workflow is watched until it finishes:
#   gh run watch --exit-status        (red run: gh run view --log-failed)
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

# Superseded pull request runs are cancelled. Runs on main are never cancelled: every main commit
# gets a verdict, gh run watch --exit-status does not end as "cancelled", and the main-only cache
# save is not lost.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: bash

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      # cargo fmt does not resolve dependencies, so it needs no engine access.
      - name: cargo fmt --check
        run: cargo fmt --all --check

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Engine access
        id: engine
        uses: ./.github/actions/engine-access
        with:
          deploy-key: ${{ secrets.GRIMOIRE_DEPLOY_KEY }}
      - name: Install pinned toolchain (rust-toolchain.toml)
        if: steps.engine.outputs.cargo == 'true'
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.engine.outputs.cargo == 'true'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        if: steps.engine.outputs.cargo == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        if: steps.engine.outputs.cargo == 'true'
        run: cargo test --workspace --locked
      - name: Build
        if: steps.engine.outputs.cargo == 'true'
        run: cargo build --workspace --locked
