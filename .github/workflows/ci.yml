# Game CI: format check and three-OS matrix (clippy, tests, build) against the pinned engine.
# Every push that triggers this workflow is watched until it finishes:
#   gh run watch --exit-status        (red run: gh run view --log-failed)
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

# Superseded pull request runs are cancelled. Runs on main are never cancelled: every main commit
# gets a verdict, gh run watch --exit-status does not end as "cancelled", and the main-only cache
# save is not lost.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # The engine is a public repository fetched anonymously over HTTPS (ADR-0013). No credentials
  # exist in CI; if the engine ever stops being publicly reachable, git must fail at once instead of
  # waiting for a credential prompt.
  GIT_TERMINAL_PROMPT: "0"
  GCM_INTERACTIVE: never

defaults:
  run:
    shell: bash

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      # cargo fmt does not resolve dependencies, so it needs no network access.
      - name: cargo fmt --check
        run: cargo fmt --all --check

  # The Python side of the asset pipeline: the figure-pack converter and the asset import. Neither
  # test suite needs Blender or a GPU; `blender_prepare.py` is covered by the pilot runs, not here.
  #
  # Runs on every trigger of this workflow rather than only on changes under `assets_src/`: GitHub
  # Actions has no per-job path filter, and a filter at the workflow level would report no status at
  # all for every other change (CONTRIBUTING, "Achtung Branch-Schutz"). The job takes well under a
  # minute, so an always-green verdict is cheaper than the gymnastics of diffing the changed paths
  # inside the job.
  assets:
    name: asset tooling (python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Pinned like every other tool here. The suites run on the 3.13 and 3.14 series; the
          # generators and their pinned wheels (below) decide the version, not the tests.
          python-version: "3.13"
      - name: Install the pinned asset tooling (numpy, Pillow)
        run: python -m pip install --disable-pip-version-check -r assets_src/textures/requirements.txt
      # Each suite runs with its own folder as the top-level directory: both import their siblings
      # by plain module name (`glb_reader`, `check_asset`), exactly as the local runs do.
      - name: figure_pack tests
        run: python -B -m unittest discover -v -s assets_src/figure_pack -t assets_src/figure_pack
      - name: asset_import tests
        run: python -B -m unittest discover -v -s assets_src/asset_import -t assets_src/asset_import

  # The asset gate (Plan 0002 WP9.3, PRD-0017 FR-02): the game's own content is compiled with the
  # engine's compiler at the pinned tag, by the same asset compiler a developer runs locally, and
  # every diagnostic fails the run. `packs/` is a build artefact, never a checked-in file.
  #
  # Two cases, two jobs, because a green gate alone proves nothing: it would be just as green with no
  # compiler at all, with the wrong directory, or with a swallowed exit code. The second case
  # compiles deliberately broken sources and is green only when they are rejected with the expected
  # diagnostics (tests/fixtures/sigil-broken/README.md).
  #
  # Runs on every trigger like the other jobs, and on Linux only; the nightly repeats it on all three
  # systems, where a difference between operating systems would show up.
  content:
    name: asset compiler (${{ matrix.case.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        case:
          - name: content/
            directory: content
            out: packs
            expect: pass
            codes: ""
          - name: negative proof
            directory: tests/fixtures/sigil-broken
            out: packs/negative
            expect: fail
            codes: tests/fixtures/sigil-broken/expected-codes.txt
    steps:
      - uses: actions/checkout@v7
      # The pin lives in Cargo.lock (ADR-0009), so `cargo update -p grimoire` moves the gate with the
      # rest of the build and no workflow has to be edited.
      - name: Engine pin from Cargo.lock
        id: pin
        run: bash .github/scripts/engine-pin.sh | tee -a "$GITHUB_OUTPUT"
      # Second checkout of the public engine repository (ADR-0013): no secret and no deploy key, only
      # the automatic read-only workflow token, which is not persisted. A failure here almost never
      # means the code is broken: the engine is not publicly reachable, or the pinned tag is gone.
      - name: Check out the engine at the pinned tag
        uses: actions/checkout@v7
        with:
          repository: LupusMalusDeviant/grimoire
          ref: ${{ steps.pin.outputs.tag }}
          path: engine
          persist-credentials: false
      # Engine tags are never moved (ADR-0009). If one ever were, the tag and the commit in
      # Cargo.lock would disagree and everything built here would be something else than the game
      # links against.
      - name: The tag is the commit Cargo.lock pins
        env:
          EXPECTED: ${{ steps.pin.outputs.rev }}
        run: |
          set -euo pipefail
          actual=$(git -C engine rev-parse HEAD)
          echo "Tag ${{ steps.pin.outputs.tag }} -> $actual"
          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error title=Engine-Tag verschoben::Tag ${{ steps.pin.outputs.tag }} zeigt auf $actual, Cargo.lock pinnt $EXPECTED."
            exit 1
          fi
      # `grimoire-ac` is younger than the engine tag this game pins; until the pin reaches a tag that
      # ships it, exactly the tag named in .github/asset-gate-bootstrap runs without the gate, loudly.
      # That file becomes an error the moment a pinned tag carries the compiler, so the exemption
      # cannot outlive its reason.
      - name: Does the pinned tag carry the asset compiler?
        id: tools
        run: bash .github/scripts/asset-tools-ready.sh "${{ steps.pin.outputs.tag }}"
      # Engine tag plus the two files that decide what is built: the lock file (which engine) and the
      # SDK pin of the tooling suite.
      - uses: actions/cache@v6
        if: steps.tools.outputs.ready == 'true'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            engine/target
          key: asset-tools-${{ runner.os }}-${{ steps.pin.outputs.tag }}-${{ hashFiles('Cargo.lock', 'engine/tools/global.json') }}
          restore-keys: |
            asset-tools-${{ runner.os }}-${{ steps.pin.outputs.tag }}-
      - name: Install the engine's pinned toolchain (rust-toolchain.toml)
        if: steps.tools.outputs.ready == 'true'
        run: rustup toolchain install
        working-directory: engine
      # Project ADR-0010: the compiler is the engine's, the C# side only orchestrates it.
      - name: Build sigilc from the pinned tag
        if: steps.tools.outputs.ready == 'true'
        run: cargo build --release -p grimoire_sigilc --bin sigilc --locked
        working-directory: engine
      - uses: actions/setup-dotnet@v6
        if: steps.tools.outputs.ready == 'true'
        with:
          global-json-file: engine/tools/global.json
          cache: true
          cache-dependency-path: engine/tools/**/packages.lock.json
      - name: Build grimoire-ac from the pinned tag
        if: steps.tools.outputs.ready == 'true'
        working-directory: engine
        run: |
          set -euo pipefail
          dotnet restore tools/src/Grimoire.AssetCompiler/Grimoire.AssetCompiler.csproj --locked-mode
          dotnet build tools/src/Grimoire.AssetCompiler/Grimoire.AssetCompiler.csproj --no-restore --configuration Release
      - name: Tool paths
        if: steps.tools.outputs.ready == 'true'
        run: |
          set -euo pipefail
          {
            echo "GRIMOIRE_SIGILC=$GITHUB_WORKSPACE/engine/target/release/sigilc"
            echo "GRIMOIRE_AC=$GITHUB_WORKSPACE/engine/tools/src/Grimoire.AssetCompiler/bin/Release/net10.0/grimoire-ac"
          } >>"$GITHUB_ENV"
      - name: grimoire-ac build ${{ matrix.case.directory }}
        if: steps.tools.outputs.ready == 'true'
        run: bash .github/scripts/asset-gate.sh "${{ matrix.case.directory }}" "${{ matrix.case.out }}" "${{ matrix.case.expect }}" "${{ matrix.case.codes }}"
      # `packs/` is a build artefact: it is produced here, kept for a week and never checked in.
      - name: Upload packs
        if: steps.tools.outputs.ready == 'true' && matrix.case.expect == 'pass'
        uses: actions/upload-artifact@v7
        with:
          name: packs-${{ github.sha }}
          path: packs/*.grimpack
          if-no-files-found: error
          retention-days: 7

  # Runs for every trigger, including pull requests from forks and Dependabot: the engine needs no
  # secret, so there is no skipped, green-but-empty variant of this job.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Own step so that a failed engine fetch (visibility, missing tag, GitHub outage) is told apart
      # from a compile or test failure. A no-op when the cache already holds the pinned sources.
      - name: Fetch dependencies (engine anonymously over HTTPS)
        run: cargo fetch --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The engine contract keeps the facade's determinism lints identical in every simulation
      # crate; the game's copies must match the clippy.toml of the pinned engine tag.
      - name: Determinism lint copies match the pinned facade
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          manifest=$(cargo metadata --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "grimoire") | .manifest_path')
          facade="$(dirname "$manifest")/clippy.toml"
          test -f "$facade"
          status=0
          for required in crates/fnp_game crates/fnp_sim_harness; do
            if [ ! -f "$required/clippy.toml" ]; then
              echo "::error title=clippy.toml fehlt::$required/clippy.toml fehlt (Kopie von crates/grimoire/clippy.toml der Engine)."
              status=1
            fi
          done
          for copy in crates/*/clippy.toml; do
            if ! diff -u "$facade" "$copy"; then
              echo "::error file=$copy,title=clippy.toml veraltet::$copy weicht von crates/grimoire/clippy.toml des gepinnten Engine-Tags ab. Datei aus dem Tag kopieren (CONTRIBUTING.md, Engine-Upgrade)."
              status=1
            fi
          done
          exit "$status"
      # --no-fail-fast: a red unit test must not stop the determinism gate of later test binaries.
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast
      - name: Build
        run: cargo build --workspace --locked
