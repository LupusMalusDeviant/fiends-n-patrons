# Game CI: format check and three-OS matrix (clippy, tests, build) against the pinned engine.
# Every push that triggers this workflow is watched until it finishes:
#   gh run watch --exit-status        (red run: gh run view --log-failed)
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

# Superseded pull request runs are cancelled. Runs on main are never cancelled: every main commit
# gets a verdict, gh run watch --exit-status does not end as "cancelled", and the main-only cache
# save is not lost.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # The engine is a public repository fetched anonymously over HTTPS (ADR-0013). No credentials
  # exist in CI; if the engine ever stops being publicly reachable, git must fail at once instead of
  # waiting for a credential prompt.
  GIT_TERMINAL_PROMPT: "0"
  GCM_INTERACTIVE: never

defaults:
  run:
    shell: bash

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      # cargo fmt does not resolve dependencies, so it needs no network access.
      - name: cargo fmt --check
        run: cargo fmt --all --check

  # Runs for every trigger, including pull requests from forks and Dependabot: the engine needs no
  # secret, so there is no skipped, green-but-empty variant of this job.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Own step so that a failed engine fetch (visibility, missing tag, GitHub outage) is told apart
      # from a compile or test failure. A no-op when the cache already holds the pinned sources.
      - name: Fetch dependencies (engine anonymously over HTTPS)
        run: cargo fetch --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The engine contract keeps the facade's determinism lints identical in every simulation
      # crate; the game's copies must match the clippy.toml of the pinned engine tag.
      - name: Determinism lint copies match the pinned facade
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          manifest=$(cargo metadata --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "grimoire") | .manifest_path')
          facade="$(dirname "$manifest")/clippy.toml"
          test -f "$facade"
          status=0
          for required in crates/fnp_game crates/fnp_sim_harness; do
            if [ ! -f "$required/clippy.toml" ]; then
              echo "::error title=clippy.toml fehlt::$required/clippy.toml fehlt (Kopie von crates/grimoire/clippy.toml der Engine)."
              status=1
            fi
          done
          for copy in crates/*/clippy.toml; do
            if ! diff -u "$facade" "$copy"; then
              echo "::error file=$copy,title=clippy.toml veraltet::$copy weicht von crates/grimoire/clippy.toml des gepinnten Engine-Tags ab. Datei aus dem Tag kopieren (CONTRIBUTING.md, Engine-Upgrade)."
              status=1
            fi
          done
          exit "$status"
      # --no-fail-fast: a red unit test must not stop the determinism gate of later test binaries.
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast
      - name: Build
        run: cargo build --workspace --locked
