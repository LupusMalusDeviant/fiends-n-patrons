[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
authors = ["Lupus Malus Deviant"]
repository = "https://github.com/LupusMalusDeviant/fiends-n-patrons"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
fnp_content = { path = "crates/fnp_content" }
fnp_game = { path = "crates/fnp_game" }
# Engine pin (ADR-0009): a release tag of the public Grimoire repository, fetched anonymously over
# HTTPS (ADR-0013). Cargo.lock records the tag commit; upgrades follow CONTRIBUTING.md, section
# "Engine-Upgrade".
grimoire = { git = "https://github.com/LupusMalusDeviant/grimoire", tag = "v0.2.0" }
# Thread-pool executor of the same engine tag (engine ADR-0006); keep the tag equal to `grimoire`.
grimoire_exec = { git = "https://github.com/LupusMalusDeviant/grimoire", tag = "v0.2.0" }
# Pack container writer, used offline by figure_pack_builder only (the `grimoire` facade crate
# does not re-export it, see that crate's Cargo.toml comment). NOT pinned to tag v0.1.1 like
# `grimoire`/`grimoire_exec` above: at that tag, grimoire_assets is still the P0 placeholder
# ("Status: placeholder -- implementation starts in phase P1", no PackWriter/PackReader/AssetId
# at all) -- `PackWriter` only exists on the engine's `main` branch, not yet in any tag. This
# `rev` pin is a deliberate, reported deviation from figuren-in-engine-spec.md's assumption that
# grimoire_assets::PackWriter was already available through the existing engine pin (see the PR
# description): it should be replaced by a proper tag bump (CONTRIBUTING.md "Engine-Upgrade") for
# `grimoire`/`grimoire_exec`/`grimoire_assets` together once a release tag covers this code, so
# the whole workspace is back on one commit of the engine.
grimoire_assets = { git = "https://github.com/LupusMalusDeviant/grimoire", tag = "v0.2.0" }
# JSON parsing for figure_pack_builder's `index.json` input (an offline dev tool, not runtime
# engine/game code, so the workspace's determinism/no-std-alloc conventions do not apply to it).
serde_json = "1.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 2
