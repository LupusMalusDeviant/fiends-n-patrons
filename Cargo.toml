[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
authors = ["LupusMalus"]
repository = "https://github.com/LupusMalusDeviant/fiends-n-patrons"
publish = false

[workspace.dependencies]
fnp_content = { path = "crates/fnp_content" }
fnp_game = { path = "crates/fnp_game" }
# Engine pin (ADR-0009): a release tag of the private Grimoire repository. Cargo.lock records the
# tag commit; upgrades follow CONTRIBUTING.md, section "Engine-Upgrade".
grimoire = { git = "https://github.com/LupusMalusDeviant/grimoire", tag = "v0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 2
