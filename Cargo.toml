[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
authors = ["Lupus Malus Deviant"]
repository = "https://github.com/LupusMalusDeviant/fiends-n-patrons"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
fnp_content = { path = "crates/fnp_content" }
fnp_game = { path = "crates/fnp_game" }
# Engine pin (ADR-0009): normally a release tag of the public Grimoire repository, fetched
# anonymously over HTTPS (ADR-0013); upgrades follow CONTRIBUTING.md, section "Engine-Upgrade".
#
# PROTOTYPE BRANCH ONLY: pinned to a commit of the engine's `main` instead of a tag. The figure
# packs of this prototype carry `FNP_MESH` payload version 2 (real tangents), which only engine
# `main` after v0.2.0 decodes (texture-quality package, strand B2); no release tag covers that yet.
# Before this can reach the game's `main`, the engine needs a release tag and every engine crate
# below goes back to `tag = ...` in one `build(engine)` commit. All entries share one commit.
grimoire = { git = "https://github.com/LupusMalusDeviant/grimoire", rev = "1ddddc954c20a53a3fab58122efe21499c2f65af" }
# Thread-pool executor of the same engine commit (engine ADR-0006); keep equal to `grimoire`.
grimoire_exec = { git = "https://github.com/LupusMalusDeviant/grimoire", rev = "1ddddc954c20a53a3fab58122efe21499c2f65af" }
# Pack container reader/writer: the `grimoire` facade does not re-export it. Used offline by
# figure_pack_builder (PackWriter) and at startup by fnp_app to open a figure pack (PackReader,
# AssetStore). Keep equal to `grimoire`.
grimoire_assets = { git = "https://github.com/LupusMalusDeviant/grimoire", rev = "1ddddc954c20a53a3fab58122efe21499c2f65af" }
# Sigil compiler, a build dependency only: fnp_content's build script compiles the `.sigil` sources
# under content/ into binary units. No runtime crate depends on it (engine ADR-0008). Keep equal to
# `grimoire`.
grimoire_sigilc = { git = "https://github.com/LupusMalusDeviant/grimoire", rev = "1ddddc954c20a53a3fab58122efe21499c2f65af" }
# JSON parsing for figure_pack_builder's `index.json` input (an offline dev tool, not runtime
# engine/game code, so the workspace's determinism/no-std-alloc conventions do not apply to it).
serde_json = "1.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 2
