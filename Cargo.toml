[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
authors = ["Lupus Malus Deviant"]
repository = "https://github.com/LupusMalusDeviant/fiends-n-patrons"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
fnp_content = { path = "crates/fnp_content" }
fnp_game = { path = "crates/fnp_game" }
# Engine pin (ADR-0009): a release tag of the public Grimoire repository, fetched anonymously over
# HTTPS (ADR-0013). Cargo.lock records the tag commit; upgrades follow CONTRIBUTING.md, section
# "Engine-Upgrade".
grimoire = { git = "https://github.com/LupusMalusDeviant/grimoire", tag = "v0.1.1" }
# Thread-pool executor of the same engine tag (engine ADR-0006); keep the tag equal to `grimoire`.
grimoire_exec = { git = "https://github.com/LupusMalusDeviant/grimoire", tag = "v0.1.1" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 2
