[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
authors = ["Lupus Malus Deviant"]
repository = "https://github.com/LupusMalusDeviant/fiends-n-patrons"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
fnp_content = { path = "crates/fnp_content" }
fnp_game = { path = "crates/fnp_game" }
# Engine pin (ADR-0009): a release tag of the public Grimoire repository, fetched anonymously over
# HTTPS (ADR-0013). Cargo.lock records the tag commit; upgrades follow CONTRIBUTING.md, section
# "Engine-Upgrade". Every engine crate below uses the same tag.
grimoire = { git = "https://github.com/LupusMalusDeviant/grimoire", tag = "v0.3.0" }
# Thread-pool executor (engine ADR-0006).
grimoire_exec = { git = "https://github.com/LupusMalusDeviant/grimoire", tag = "v0.3.0" }
# Pack container reader/writer: the `grimoire` facade does not re-export it. Used offline by
# figure_pack_builder (PackWriter) and at startup by fnp_app to open a figure pack (PackReader,
# AssetStore).
grimoire_assets = { git = "https://github.com/LupusMalusDeviant/grimoire", tag = "v0.3.0" }
# Sigil compiler, a build dependency only: fnp_content's build script compiles the `.sigil` sources
# under content/ into binary units until the asset compiler exists (plan 0002 WP4.3, PO decision
# 2026-09-17). No runtime crate depends on it (engine ADR-0008).
grimoire_sigilc = { git = "https://github.com/LupusMalusDeviant/grimoire", tag = "v0.3.0" }
# JSON parsing for figure_pack_builder's `index.json` input (an offline dev tool, not runtime
# engine/game code, so the workspace's determinism/no-std-alloc conventions do not apply to it).
serde_json = "1.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 2
